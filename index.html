<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A2442">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>警校考研助手</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== 应用头部 ===== -->
  <header class="app-header">
    <img class="app-badge" src="assets/badge.png" alt="警徽" onerror="this.style.display='none'">
    <h1 class="app-title">警校考研助手</h1>
    <p class="app-subtitle">忠诚 · 求实 · 勤奋 · 创新</p>
  </header>

  <!-- ===== 主内容区 ===== -->
  <main class="app-main">

    <!-- 首页 Tab -->
    <section class="tab-panel active" id="panel-home">
      <div class="home-layout">
        <!-- 倒计时 -->
        <div class="card countdown-card" title="点击修改考试日期">
          <span class="card-label">距离考试还有</span>
          <span class="countdown-number">--</span>
          <span class="countdown-unit">天</span>
          <p class="card-hint">加载中…</p>
        </div>

        <!-- 今日打卡快速状态 -->
        <div class="card" id="home-checkin-card">
          <h2 class="card-title">今日打卡</h2>
          <div id="home-checkin-status">
            <p class="card-hint">加载中…</p>
          </div>
        </div>

        <!-- 今日计划概览 -->
        <div class="card">
          <h2 class="card-title">今日学习计划</h2>
          <div id="home-plans">
            <p class="card-hint">加载中…</p>
          </div>
        </div>

        <!-- 收藏院校置顶 -->
        <div class="card">
          <h2 class="card-title">我的目标院校</h2>
          <div id="home-favorites">
            <p class="card-hint">加载中…</p>
          </div>
        </div>
      </div>
    </section>

    <!-- 目标院校 Tab -->
    <section class="tab-panel" id="panel-schools">
      <div class="page-header">
        <h2 class="page-title">目标警校规划</h2>
      </div>
      <div id="schools-list" class="schools-list">
        <p class="card-hint" style="text-align:center;padding:40px 0;">院校数据加载中…</p>
      </div>
      <div id="schools-actions" class="schools-actions" style="display:none;">
        <button class="btn-gold" id="btn-generate-plan">一键生成备考科目清单</button>
        <button class="btn-gold primary" id="btn-confirm-school">确认目标，同步倒计时</button>
      </div>
    </section>

    <!-- 学习打卡 Tab -->
    <section class="tab-panel" id="panel-checkin">
      <div class="page-header">
        <h2 class="page-title">每日学习打卡</h2>
      </div>

      <!-- 日历 -->
      <div class="card calendar-card" id="calendar-container">
        <p class="card-hint" style="text-align:center;padding:40px 0;">日历加载中…</p>
      </div>

      <!-- 温和断卡提示 -->
      <p class="muted-hint" id="checkin-muted-hint" style="display:none;">📌 只能为今天及以前的日期打卡哦，明天再来吧</p>

      <!-- 打卡项 -->
      <div class="card">
        <h2 class="card-title">今日打卡</h2>
        <div class="checkin-items" id="checkin-items">
          <p class="card-hint">加载中…</p>
        </div>
      </div>

      <!-- 统计 -->
      <div class="stats-row" id="checkin-stats">
        <div class="stat-card">
          <span class="stat-number">0</span>
          <span class="stat-label">连续打卡 / 天</span>
        </div>
        <div class="stat-card">
          <span class="stat-number">0</span>
          <span class="stat-label">本月学习 / 小时</span>
        </div>
      </div>
    </section>

    <!-- 学习计划 Tab -->
    <section class="tab-panel" id="panel-plans">
      <div class="page-header">
        <h2 class="page-title">学习计划</h2>
        <button class="btn-icon" id="btn-add-plan" aria-label="添加计划">+</button>
      </div>
      <!-- 科目筛选 -->
      <div class="subject-filters">
        <button class="subject-chip active" data-subject="all">全部</button>
        <button class="subject-chip" data-subject="politics">政治</button>
        <button class="subject-chip" data-subject="english">英语</button>
        <button class="subject-chip" data-subject="math">数学</button>
        <button class="subject-chip" data-subject="specialized">专业课</button>
      </div>
      <div id="plans-list" class="plans-list">
        <p class="card-hint" style="text-align:center;padding:40px 0;">暂无学习计划，点击右上角 + 添加</p>
      </div>
    </section>

  </main>

  <!-- ===== 底部导航栏 ===== -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">首页</span>
    </button>
    <button class="nav-item" data-tab="schools">
      <span class="nav-icon">🎓</span>
      <span class="nav-label">院校</span>
    </button>
    <button class="nav-item" data-tab="checkin">
      <span class="nav-icon">✅</span>
      <span class="nav-label">打卡</span>
    </button>
    <button class="nav-item" data-tab="plans">
      <span class="nav-icon">📋</span>
      <span class="nav-label">计划</span>
    </button>
    <button class="nav-item" data-tab="photos">
      <span class="nav-icon">📸</span>
      <span class="nav-label">历程</span>
    </button>
  </nav>

    <!-- 学习历程 Tab -->
    <section class="tab-panel" id="panel-photos">
      <div class="page-header">
        <h2 class="page-title">学习历程</h2>
      </div>
      <div class="photos-grid" id="photos-grid">
        <p class="card-hint" style="text-align:center;padding:40px 0;">加载中…</p>
      </div>
      <button class="btn-gold primary" id="btn-upload-photo" style="margin-top:12px;">📷 上传照片</button>
      <input type="file" id="photo-file-input" accept="image/*" capture="environment" style="display:none;">
    </section>

  </main>

  <!-- ===== 图片查看器 ===== -->
  <div class="viewer-overlay" id="photo-viewer">
    <span class="viewer-close">✕</span>
    <img class="viewer-image" src="" alt="">
  </div>

  <!-- ===== 计划表单弹窗 ===== -->
  <div class="form-overlay" id="plan-form-overlay">
    <div class="form-panel">
      <h3 class="form-title">添加学习计划</h3>
      <form id="plan-form">
        <input type="hidden" name="plan-id" value="">

        <label class="form-label">科目</label>
        <select name="plan-subject" class="form-select">
          <option value="politics">政治</option>
          <option value="english">英语</option>
          <option value="math">数学</option>
          <option value="specialized">专业课</option>
        </select>

        <label class="form-label">计划标题</label>
        <input type="text" name="plan-title" class="form-input" placeholder="例如：做完第三章习题" required>

        <label class="form-label">备注（选填）</label>
        <textarea name="plan-desc" class="form-textarea" rows="2" placeholder="补充说明…"></textarea>

        <label class="form-label">提醒时间</label>
        <input type="time" name="plan-time" class="form-input" value="09:00">

        <label class="form-label">重复类型</label>
        <select name="plan-repeat" class="form-select">
          <option value="none">仅一次</option>
          <option value="daily" selected>每天</option>
          <option value="weekly">每周</option>
        </select>

        <div class="form-buttons">
          <button type="button" class="form-btn-cancel">取消</button>
          <button type="submit" class="form-btn-submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 警徽暗纹底纹层 -->
  <div class="watermark"></div>

  <script src="js/db.js"></script>
  <script src="js/schools.js"></script>
  <script src="js/countdown.js"></script>
  <script src="js/plans.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/checkin.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
